<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="162-0">
  <!--
    The app mark: home plate — a square with a point at the bottom, drawn rather than lettered, so it reads at 32px on
    a home screen where "162-0" would be a smudge. The plate is the one shape in
    baseball nobody mistakes for another sport.
  -->
  <rect width="512" height="512" rx="114" fill="#0b0e13"/>
  <path d="M148 132 H364 V266 L256 386 L148 266 Z"
        fill="none" stroke="#f97a1f" stroke-width="30" stroke-linejoin="round"/>
  <path d="M212 206 H300 V262 L256 312 L212 262 Z" fill="#f97a1f"/>
</svg>
