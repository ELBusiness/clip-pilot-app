# Publishes the game to GitHub Pages on every push to the development branch.
#
# One-time setup, in the repository's Settings -> Pages: set Source to
# "GitHub Actions". Nothing else is needed — no tokens, no accounts.
#
# The site is static, so a deploy is an upload of plain files. A custom domain
# later means setting SITE_URL to it and clearing BASE_PATH, because a root
# domain serves from / while a project site serves from /<repo>/.
name: Deploy

on:
  push:
    branches: [claude/82-0-sports-variants-dgy4ep]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The asset renderer needs a browser; the app and its tests do not.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # A broken build is not worth publishing, and these take seconds.
      - run: npm run typecheck
      - run: npm test

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm run build
        env:
          # A project site is served from /<repo>/, so every absolute path in
          # the page has to carry it: the manifest, the icons, the share card.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
