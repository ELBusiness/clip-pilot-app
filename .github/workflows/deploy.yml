# Publishes the game to GitHub Pages on every push to the development branch.
#
# No setup required: the first run turns Pages on itself. The repository has to
# be public, or on a plan that includes Pages for private repositories.
#
# The site is static, so a deploy is an upload of plain files. A custom domain
# later means setting SITE_URL to it and clearing BASE_PATH, because a root
# domain serves from / while a project site serves from /<repo>/.
name: Deploy

on:
  push:
    branches: [claude/82-0-sports-variants-dgy4ep]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The asset renderer needs a browser; the app and its tests do not.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # A broken build is not worth publishing, and these take seconds.
      - run: npm run typecheck
      - run: npm test

      # enablement turns Pages on through the API on the first run, so there is
      # no click-here step standing between a push and a live site. Without it
      # the first deploy fails with "Get Pages site failed ... Not Found",
      # which reads like a broken workflow rather than a setting nobody set.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - run: npm run build
        env:
          # A project site is served from /<repo>/, so every absolute path in
          # the page has to carry it: the manifest, the icons, the share card.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
